<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Quiz - Custom Trend</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            padding: 30px 20px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1, h2 {
            text-align: center;
            color: #262626;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #0095f6;
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0077c2;
        }
        .question-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .question-box span {
            font-size: 14px;
            color: #333;
        }
        .delete-btn {
            background: #ed4956;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .result-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 2px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .avatar-placeholder {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 22px;
            font-weight: 800;
            color: #262626;
            margin: 10px 0;
        }
        .result-badge {
            display: inline-block;
            background: #8e44ad;
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: bold;
            transform: rotate(-2deg);
        }
        .link-box {
            background: #efefef;
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SCREEN 1: CREATE QUIZ -->
    <div id="screen-create" class="screen active">
        <h1>Create Trust Quiz 🎭</h1>
        <div class="form-group">
            <label>Aapka Naam:</label>
            <input type="text" id="creator-name" placeholder="Jaise: Hiren">
        </div>
        <div class="form-group">
            <label>Custom Sawaal Add Karein:</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="custom-q-input" placeholder="Jaise: Kya tu mujhse jhoot bolta hai?">
                <button class="btn" style="width: auto; margin-top: 0; padding: 0 15px;" onclick="addQuestion()">Add</button>
            </div>
        </div>
        <div id="questions-list" style="max-height: 150px; overflow-y: auto; margin-bottom: 15px;">
            <!-- Added questions list -->
        </div>
        <button class="btn" onclick="generateQuizLink()">Generate Link 🚀</button>
    </div>

    <!-- SCREEN 2: SHARE LINK -->
    <div id="screen-share" class="screen">
        <h1>Link Ready! 🔥</h1>
        <p style="font-size: 14px; color: #666; margin-bottom: 10px; text-align: center;">Apne doston ko yeh link bhejo:</p>
        <div class="link-box" id="generated-link-display"></div>
        <button class="btn" onclick="copyLink()">Copy Link 📋</button>
        <button class="btn" style="background: #25D366; margin-top: 8px;" onclick="shareOnWhatsApp()">Share on WhatsApp 💚</button>
    </div>

    <!-- SCREEN 3: TAKE QUIZ (FOR FRIENDS) -->
    <div id="screen-quiz" class="screen">
        <h2 id="quiz-header-title">Trust Quiz</h2>
        <div id="quiz-container">
            <!-- Dynamic questions -->
        </div>
        <button class="btn" onclick="submitQuiz()">Submit Answers ✨</button>
    </div>

    <!-- SCREEN 4: RESULT CARD -->
    <div id="screen-result" class="screen">
        <div class="result-card">
            <div class="avatar-placeholder">🧔🏻‍♂️</div>
            <div class="result-title" id="res-name-display">Hiren doesn't</div>
            <div class="result-badge"><span id="res-badge-text">trust you</span></div>
            <p style="font-size: 13px; color: #888; margin-top: 15px;">🕵️‍♂️ searching my fake friends... 👀</p>
        </div>
        <button class="btn" onclick="location.reload()">Create Your Own Quiz 🎯</button>
    </div>
</div>

<script>
    let questions = [
        "Kya tu mujh par trust karta hai?",
        "Kya tune kabhi meri peeth peeche burai ki hai?"
    ];

    let quizData = {
        name: "Hiren",
        questions: []
    };

    function renderQuestionsList() {
        const list = document.getElementById('questions-list');
        list.innerHTML = '';
        questions.forEach((q, index) => {
            list.innerHTML += `
                <div class="question-box">
                    <span>${index + 1}. ${q}</span>
                    <button class="delete-btn" onclick="removeQuestion(${index})">X</button>
                </div>
            `;
        });
    }

    function addQuestion() {
        const input = document.getElementById('custom-q-input');
        if(input.value.trim() !== '') {
            questions.push(input.value.trim());
            input.value = '';
            renderQuestionsList();
        }
    }

    function removeQuestion(index) {
        questions.splice(index, 1);
        renderQuestionsList();
    }

    function generateQuizLink() {
        const name = document.getElementById('creator-name').value.trim();
        if(!name) {
            alert('Pehle apna naam toh daal bhai!');
            return;
        }
        if(questions.length === 0) {
            alert('Kam se kam ek sawaal toh add kar!');
            return;
        }

        quizData.name = name;
        quizData.questions = questions;

        // Encode data into base64 url hash simulation
        const encodedData = btoa(JSON.stringify(quizData));
        const dummyLink = window.location.href.split('#')[0] + '#' + encodedData;

        document.getElementById('generated-link-display').innerText = dummyLink;
        switchScreen('screen-share');
    }

    function copyLink() {
        const linkText = document.getElementById('generated-link-display').innerText;
        navigator.clipboard.writeText(linkText);
        alert('Link copied to clipboard! Ab kahin bhi paste kar de.');
    }

    function shareOnWhatsApp() {
        const linkText = document.getElementById('generated-link-display').innerText;
        window.open(`https://api.whatsapp.com/send?text=Dekh le bhai mujh par kitna trust hai tera? Is link pe click kar: ${linkText}`, '_blank');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // Check if URL has hash data when someone opens the link
    window.onload = function() {
        renderQuestionsList();
        if(window.location.hash) {
            try {
                const decodedData = JSON.parse(atob(window.location.hash.substring(1)));
                quizData = decodedData;
                document.getElementById('quiz-header-title').innerText = `${quizData.name}'s Trust Quiz`;
                
                const container = document.getElementById('quiz-container');
                container.innerHTML = '';
                quizData.questions.forEach((q, i) => {
                    container.innerHTML += `
                        <div class="form-group">
                            <label>${i + 1}. ${q}</label>
                            <input type="text" placeholder="Apna jawab likhein..." class="friend-answer" required>
                        </div>
                    `;
                });
                switchScreen('screen-quiz');
            } catch(e) {
                console.error(e);
            }
        }
    };

    function submitQuiz() {
        document.getElementById('res-name-display').innerText = `${quizData.name} doesn't`;
        document.getElementById('res-badge-text').innerText = 'trust you 💀';
        switchScreen('screen-result');
    }
</script>

</body>
</html>
